<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRN &amp; Rework Tasks – Working prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F2EE;--surface:#FFFFFF;--surface2:#FAF9F6;--ink:#1B1F24;--ink2:#3A424C;--muted:#5A626C;--line:#DAD6CE;--line2:#EEEAE3;--field:#C9C4BA;
  --navy:#1F3A5F;--navy2:#2C4E7A;--onnavy:#FFFFFF;--onnavy2:#C3D0E2;
  --red:#A61E14;--red-s:#FBDCD8;--red-i:#8F1A14;--amb-s:#FAE7BF;--amb-i:#6E4200;--or-s:#FDE2CC;--or-i:#7A3300;
  --tl-s:#D9EDF2;--tl-i:#0E5163;--pu-s:#E9E0F6;--pu-i:#512883;--gr:#1E6B45;--gr-s:#DDF0E4;--gr-i:#1E6B45;
  --bl-s:#E1EAF7;--bl-i:#1F4B8A;--gy-s:#E8EAED;--gy-i:#2B3038;--dis:#B8C2CF;--dis-i:#2B3038;--demo:#2B3038;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171B;--surface:#1C2026;--surface2:#20252C;--ink:#ECEEF1;--ink2:#C9CED6;--muted:#A0A7B1;--line:#333A43;--line2:#2A3038;--field:#4A525C;
    --navy:#18304F;--navy2:#24426A;--onnavy:#FFFFFF;--onnavy2:#B9C8DC;
    --red:#C2362B;--red-s:#3D1F1D;--red-i:#F2B4AD;--amb-s:#3A2E14;--amb-i:#F0CF8A;--or-s:#3D2A1A;--or-i:#F5C49B;
    --tl-s:#16343B;--tl-i:#9FD6E2;--pu-s:#2E2540;--pu-i:#D2C1F0;--gr:#2E8A5C;--gr-s:#1A3326;--gr-i:#9CDAB7;
    --bl-s:#22324A;--bl-i:#B9CDEB;--gy-s:#2A3038;--gy-i:#D6DAE0;--dis:#3A424C;--dis-i:#A0A7B1;--demo:#0C0E11;
  }
}
:root[data-theme="dark"]{
  --bg:#14171B;--surface:#1C2026;--surface2:#20252C;--ink:#ECEEF1;--ink2:#C9CED6;--muted:#A0A7B1;--line:#333A43;--line2:#2A3038;--field:#4A525C;
  --navy:#18304F;--navy2:#24426A;--onnavy:#FFFFFF;--onnavy2:#B9C8DC;
  --red:#C2362B;--red-s:#3D1F1D;--red-i:#F2B4AD;--amb-s:#3A2E14;--amb-i:#F0CF8A;--or-s:#3D2A1A;--or-i:#F5C49B;
  --tl-s:#16343B;--tl-i:#9FD6E2;--pu-s:#2E2540;--pu-i:#D2C1F0;--gr:#2E8A5C;--gr-s:#1A3326;--gr-i:#9CDAB7;
  --bl-s:#22324A;--bl-i:#B9CDEB;--gy-s:#2A3038;--gy-i:#D6DAE0;--dis:#3A424C;--dis-i:#A0A7B1;--demo:#0C0E11;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--bl-i)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #5B8DEF;outline-offset:2px}
h1,h2,h3{font-family:Archivo,"Arial Narrow",system-ui,sans-serif;margin:0;letter-spacing:.005em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.92em}

/* demo bar */
.demo{background:var(--demo);color:#E8EAED;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:8px 20px;font-size:13px}
.demo b{font-weight:600;color:#FFFFFF}
.demo select,.demo button{height:34px;border-radius:6px;border:1px solid #4A525C;background:#1B1F24;color:#FFFFFF;padding:0 10px;cursor:pointer}
.demo .grp{display:flex;gap:8px;align-items:center}
.demo .seg{display:flex}
.demo .seg button{border-radius:0}.demo .seg button:first-child{border-radius:6px 0 0 6px}.demo .seg button:last-child{border-radius:0 6px 6px 0;border-left:none}
.demo .seg button[aria-pressed="true"]{background:#E8EAED;color:#1B1F24}
.demo .spacer{flex-grow:1}

.stage{padding:0}
body.phone .stage{padding:24px 12px 48px}
#app{container-type:inline-size;container-name:app;min-height:calc(100vh - 50px);background:var(--bg)}
body.phone #app{max-width:390px;margin:0 auto;min-height:844px;border:10px solid #2B3038;border-radius:34px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}

/* app header */
.top{background:var(--navy);color:var(--onnavy);display:flex;align-items:center;gap:28px;padding:0 28px;min-height:64px;flex-wrap:wrap}
.brand{font-family:Archivo,"Arial Narrow",sans-serif;font-weight:800;font-size:19px;white-space:nowrap}
.nav{display:flex;gap:4px;flex-grow:1;overflow-x:auto}
.nav a{color:var(--onnavy2);text-decoration:none;padding:9px 13px;border-radius:6px;font-size:14px;white-space:nowrap}
.nav a[aria-current="page"]{color:#FFFFFF;background:rgba(255,255,255,.15);font-weight:600}
.nav a:hover{color:#FFFFFF}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:#D6E0EE;color:#1F3A5F;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.who small{display:block;color:var(--onnavy2);font-size:12px}
.bell{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;border-radius:50%}
.bell .n{position:absolute;top:4px;right:2px;background:#E5484D;color:#FFFFFF;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}

main{padding:26px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1500px;margin:0 auto}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:28px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px 22px}
.card h2{font-size:18px;font-weight:700}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#FFFFFF;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sec{background:var(--surface);color:var(--bl-i);border-color:var(--field)}
.btn.good{background:var(--gr);border-color:var(--gr)}
.btn.warn{background:var(--surface);color:var(--or-i);border-color:var(--field)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.btn:disabled{background:var(--dis);border-color:var(--dis);color:var(--dis-i);cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.field .hint{font-weight:400;font-size:12px;color:var(--muted)}
.field .req{font-weight:500;font-size:12px;color:var(--red-i)}
input[type=text],input[type=number],input[type=date],select,textarea{height:44px;border:1px solid var(--field);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:400;width:100%}
textarea{height:auto;padding:10px;resize:vertical;min-height:80px}
.err{border-color:var(--red)!important;border-width:2px!important}
.errmsg{color:var(--red-i);font-size:13px;font-weight:500}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.tile[aria-pressed="true"]{border:2px solid var(--navy);padding:13px 13px 11px}
.tile .l{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--ink2)}
.tile .dot{width:10px;height:10px;border-radius:50%}
.tile .v{font-family:Archivo,sans-serif;font-size:32px;font-weight:700;line-height:1}
.tile .h{font-size:12px;color:var(--muted)}

.filters{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;padding:14px 20px;background:var(--surface2);border-bottom:1px solid var(--line2)}
.filters .field input,.filters .field select{height:38px;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;color:var(--ink)}
.chk input{width:18px;height:18px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:var(--surface2)}
.tablewrap{overflow-x:auto}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.flag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:var(--red);color:#FFFFFF;margin-left:6px;white-space:nowrap}
.esc{font-weight:700;color:var(--red-i)}
.dim{color:var(--muted)}
.cards{display:none;flex-direction:column;gap:10px;padding:12px}
.tcard{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.tcard .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard .ttl{font-size:16px;font-weight:600}
.tcard .meta{font-size:13px;color:var(--muted)}
.tcard .foot{display:flex;justify-content:space-between;border-top:1px solid var(--line2);padding-top:8px;font-size:13px;font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px}
.steps{display:flex;padding:16px 20px;gap:0;overflow-x:auto}
.step{display:flex;align-items:center;gap:10px;flex-grow:1;min-width:120px}
.step .b{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--field);color:var(--muted);background:var(--surface);flex-shrink:0}
.step.done .b{background:var(--navy);border-color:var(--navy);color:#FFFFFF}
.step.cur .b{border-color:var(--red);color:var(--red-i)}
.step .t{font-size:13px;font-weight:600;line-height:1.2}
.step .w{font-size:12px;color:var(--muted);font-weight:400}
.step .ln{flex-grow:1;height:2px;background:var(--line);margin:0 6px}
.step.done .ln{background:var(--navy)}
.step:last-child .ln{display:none}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 22px}
.facts .k{font-size:12px;font-weight:600;color:var(--muted)}
.facts .v{font-size:15px;font-weight:500}
.calc{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.calc .box{flex:1 1 120px;background:var(--bg);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.calc .box .k{font-size:12px;font-weight:600;color:var(--ink2)}
.calc .box .v{font-size:18px;font-weight:600}
.calc .op{display:flex;align-items:center;font-size:20px;color:var(--muted)}
.calc .box.due{background:var(--bl-s)}.calc .box.due .k,.calc .box.due .v{color:var(--bl-i)}
.calc .box.late{background:var(--red-s)}.calc .box.late .k,.calc .box.late .v{color:var(--red-i)}
.hist{display:flex;flex-direction:column}
.hi{display:flex;gap:12px}
.hi .rail{display:flex;flex-direction:column;align-items:center}
.hi .rail i{width:10px;height:10px;border-radius:50%;background:var(--navy);margin-top:6px}
.hi .rail span{flex-grow:1;width:2px;background:var(--line2);margin-top:4px}
.hi .body{padding-bottom:14px;display:flex;flex-direction:column;gap:1px}
.hi .w{font-size:14px;font-weight:600}
.hi .d{font-size:13px;color:var(--ink2)}
.hi .m{font-size:12px;color:var(--muted)}
.action{border:2px solid var(--navy)}
.action h2{margin-bottom:4px}
.stack{display:flex;flex-direction:column;gap:14px}
.note{background:var(--bl-s);color:var(--bl-i);border-radius:10px;padding:12px 14px;font-size:14px}
.note.ok{background:var(--gr-s);color:var(--gr-i)}
.note.bad{background:var(--red-s);color:var(--red-i)}
.note.amb{background:var(--amb-s);color:var(--amb-i)}
.radio{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border:1px solid var(--field);border-radius:10px;font-weight:500;cursor:pointer;background:var(--surface)}
.radio input{width:20px;height:20px}
.radio:has(input:checked){border:2px solid var(--navy);padding:0 13px;font-weight:600}
details.more{border-top:1px solid var(--line2);padding-top:12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--bl-i);font-size:14px;min-height:32px;display:flex;align-items:center}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lvl{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lvl b{color:var(--red-i)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--gy-s);color:var(--gy-i);font-size:13px;margin:0 6px 6px 0}
.pill button{border:none;background:transparent;cursor:pointer;width:24px;height:24px;border-radius:50%;color:inherit}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1B1F24;color:#FFFFFF;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:50;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
footer.foot{padding:12px 28px 24px;color:var(--muted);font-size:12px;text-align:center}

@container app (max-width: 1100px){
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .filters{grid-template-columns:repeat(4,minmax(0,1fr))}
  .detail{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container app (max-width: 640px){
  .top{padding:10px 14px;gap:10px}
  .nav{order:3;width:100%;flex-basis:100%}
  .who .txt{display:none}
  main{padding:16px 14px 40px;gap:14px}
  .pagehead h1{font-size:23px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile .v{font-size:26px}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px}
  .wl-table{display:none}
  .cards{display:flex}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3,.grid4,.formgrid{grid-template-columns:minmax(0,1fr)}
  .calc .op{display:none}
  .pad{padding:16px}
  .btn{width:100%}
  .row .btn{width:auto}
  .stack > .btn{width:100%}
}
</style>
</head>
<body>
<div class="demo" role="region" aria-label="Prototype controls">
  <span><b>Prototype controls</b></span>
  <label class="grp">View as <select id="roleSel" aria-label="View as role"></select></label>
  <span class="grp">Today: <b id="todayLbl"></b> <button id="nextDay" title="Advance the system clock one day and run monitoring">Next day</button></span>
  <span class="seg" role="group" aria-label="Device">
    <button id="devDesk" aria-pressed="true">Desktop</button><button id="devPhone" aria-pressed="false">Phone</button>
  </span>
  <span class="spacer"></span>
  <button id="resetBtn">Reset demo data</button>
</div>
<div class="stage"><div id="app"></div></div>
<div id="toastHost" aria-live="polite"></div>

<script>
(function(){
'use strict';
var STORE='rework-proto-v1';
var BUYERS=['A. Rao','S. Iyer','K. Mehta','P. Nair'];
var ROLES=[
  {id:'qa',type:'qa',label:'Inward QA',name:'Inward QA inspector'},
  {id:'b1',type:'buyer',label:'Buyer – A. Rao',name:'A. Rao'},
  {id:'b2',type:'buyer',label:'Buyer – S. Iyer',name:'S. Iyer'},
  {id:'b3',type:'buyer',label:'Buyer – K. Mehta',name:'K. Mehta'},
  {id:'b4',type:'buyer',label:'Buyer – P. Nair',name:'P. Nair'},
  {id:'quality',type:'quality',label:'Quality Department',name:'Quality inspector'},
  {id:'mgr',type:'mgr',label:'Buyer Manager',name:'Buyer Manager'},
  {id:'admin',type:'admin',label:'Administrator / Purchasing Coordinator',name:'Administrator'},
  {id:'planner',type:'view',label:'Planner (view only)',name:'Planner'},
  {id:'stores',type:'stores',label:'Stores',name:'Stores user'},
  {id:'assembly',type:'view',label:'Assembly (view only)',name:'Assembly user'}
];
var STAGE={New:'New',Exception:'Assignment Exception',Assigned:'Assigned',Acknowledged:'Acknowledged',InProgress:'In Progress',PendingQV:'Pending Quality Verification',Clarification:'Clarification Required',Reopened:'Reopened',Verified:'Verified',Closed:'Closed'};
var CHIP={
  'New':['--gy-s','--gy-i'],'Assignment Exception':['--or-s','--or-i'],'Assigned':['--bl-s','--bl-i'],
  'Acknowledgement Overdue':['--red-s','--red-i'],'Acknowledged':['--bl-s','--bl-i'],'In Progress':['--tl-s','--tl-i'],
  'Due Soon':['--amb-s','--amb-i'],'Overdue':['--red','#FFFFFF'],'Pending Quality Verification':['--pu-s','--pu-i'],
  'Clarification Required':['--amb-s','--amb-i'],'Reopened':['--or-s','--or-i'],'Verified':['--gr-s','--gr-i'],'Closed':['--gr','#FFFFFF']
};
var S=null, F={tile:-1,mat:'',pos:'',reason:'',buyer:'',status:'',due:'',overdue:false,closed:false}, ERR={};

/* ---------- dates ---------- */
function pad2(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(s,long){if(!s)return '—';var d=parse(s);return (long?DOW[d.getDay()]+' ':'')+pad2(d.getDate())+' '+MON[d.getMonth()]+(long?' '+d.getFullYear():'')}
function fmtTs(ts){if(!ts)return '—';var p=ts.split(' ');return fmt(p[0],false)+' '+parse(p[0]).getFullYear()+', '+(p[1]||'')}
function counts(d){if(S.settings.basis==='calendar')return true;var w=d.getDay();if(w===0||w===6)return false;return S.holidays.indexOf(iso(d))<0}
function addDays(s,n){var d=parse(s);var step=n>=0?1:-1,k=Math.abs(n);while(k>0){d.setDate(d.getDate()+step);if(counts(d))k--}return iso(d)}
function addCal(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function between(a,b){/* counted days in (a,b] */ if(b<=a)return 0;var d=parse(a),n=0,end=parse(b);while(d<end){d.setDate(d.getDate()+1);if(counts(d))n++}return n}
function calDays(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function now(){var d=new Date();return S.today+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())}
function dueOf(t){return t.forecast?addDays(t.forecast,S.settings.buffer+S.settings.sla):null}

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function R(){for(var i=0;i<ROLES.length;i++)if(ROLES[i].id===S.role)return ROLES[i];return ROLES[0]}
function task(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].id===id)return S.tasks[i];return null}
function gate(no){for(var i=0;i<S.gate.length;i++)if(S.gate[i].no===no)return S.gate[i];return null}
function hist(t,who,what,detail,at){t.history.unshift({at:at||now(),who:who,what:what,detail:detail||''})}

/* ---------- derived view of a task ---------- */
function view(t){
  var s=S.settings,today=S.today,v={status:STAGE[t.stage],overdue:false,esc:0,escTxt:'—',ackOverdue:false,qvOverdue:false,due:dueOf(t),late:0};
  var open=['Verified','Closed'].indexOf(t.stage)<0;
  if(t.stage==='Assigned'){v.ackBy=addDays(t.assignedOn,s.ackSla);if(today>v.ackBy){v.ackOverdue=true;v.status='Acknowledgement Overdue';v.escTxt='Ack'}}
  if(v.due&&open&&today>v.due){v.overdue=true;v.late=between(v.due,today);v.esc=v.late>=s.l3?3:v.late>=s.l2?2:v.late>=s.l1?1:0}
  if(t.critical&&open)v.esc=3;
  if(v.esc)v.escTxt='L'+v.esc;
  if(t.stage==='InProgress'&&v.due){if(v.overdue)v.status='Overdue';else if(between(today,v.due)<=s.dueSoon)v.status='Due Soon'}
  if(t.stage==='PendingQV'&&t.sentToQuality){v.qvBy=addDays(t.sentToQuality,s.qSla);if(today>v.qvBy){v.qvOverdue=true;if(!v.esc)v.escTxt='QV'}}
  v.owner={New:'Inward QA',Exception:'Purchasing Coordinator',PendingQV:'Quality Department',Verified:'System',Closed:'System'}[t.stage]||t.buyer;
  v.age=calDays(t.createdOn,t.closedOn||today);
  return v;
}

/* ---------- monitoring job ---------- */
function runMonitor(){
  var n0=S.notes.length;
  S.tasks.forEach(function(t){
    var v=view(t),e=t.escN||(t.escN={lvl:0,ack:false,qv:false,soon:false});
    if(v.ackOverdue&&!e.ack){e.ack=true;notify('Acknowledgement overdue',t,[t.buyer,'Buyer Manager / Purchase Head'],'Escalation + dashboard flag');hist(t,'System','Escalated: acknowledgement overdue','Ack SLA of '+S.settings.ackSla+' day(s) exceeded')}
    if(v.status==='Due Soon'&&!e.soon){e.soon=true;notify('Due soon reminder',t,[t.buyer],'In-app + email/Teams')}
    if(v.esc>e.lvl){for(var L=e.lvl+1;L<=v.esc;L++){var rec=L===1?[t.buyer,'Buyer Manager / Purchase Head']:L===2?['Buyer Manager','Function Head','Planner / Assembly']:['Function Head','Plant / Operations leadership'];
      notify('Overdue – Level '+L,t,rec,L===3?'Critical escalation':'Escalation + red flag');hist(t,'System','Escalated to Level '+L,'Recipients: '+rec.join(', '))}e.lvl=v.esc}
    if(v.qvOverdue&&!e.qv){e.qv=true;notify('Quality verification overdue',t,['Quality inspector','Quality Manager / Quality Head'],'Escalation + dashboard flag');hist(t,'System','Escalated: Quality verification overdue','Quality SLA of '+S.settings.qSla+' day(s) exceeded')}
  });
  return S.notes.length-n0;
}

var TILES=[
  ['New / exception','Needs Buyer mapping','var(--or-i)',function(x){return x.t.stage==='New'||x.t.stage==='Exception'}],
  ['Unacknowledged','Waiting for Buyer','var(--bl-i)',function(x){return x.t.stage==='Assigned'}],
  ['In progress','Forecast recorded','var(--tl-i)',function(x){return x.v.status==='In Progress'||x.t.stage==='Acknowledged'}],
  ['Due soon','Within reminder window','#C58A00',function(x){return x.v.status==='Due Soon'}],
  ['Overdue','Past task due date','var(--red)',function(x){return x.v.overdue}],
  ['Pending QV','With Quality','var(--pu-i)',function(x){return x.t.stage==='PendingQV'||x.t.stage==='Clarification'}],
  ['Reopened','Rejected by Quality','var(--or-i)',function(x){return x.t.stage==='Reopened'}]
];
function all(){return S.tasks.map(function(t){return {t:t,v:view(t)}})}
function filtered(){
  var L=all().filter(function(x){
    if(!F.closed&&x.t.stage==='Closed')return false;
    if(F.tile>=0&&!TILES[F.tile][3](x))return false;
    if(F.mat&&x.t.mat!==F.mat)return false;
    if(F.pos&&String(x.t.pos).indexOf(F.pos)<0)return false;
    if(F.reason&&x.t.reason!==F.reason)return false;
    if(F.buyer&&x.t.buyer!==F.buyer)return false;
    if(F.status&&x.v.status!==F.status)return false;
    if(F.due&&!(x.v.due&&x.v.due<=F.due))return false;
    if(F.overdue&&!x.v.overdue)return false;
    return true;
  });
  var rank=function(x){return x.v.overdue?0:x.v.ackOverdue?1:x.t.stage==='Exception'?2:x.v.status==='Due Soon'?3:x.t.stage==='Reopened'?4:5};
  L.sort(function(a,b){return rank(a)-rank(b)||(a.v.due||'9999').localeCompare(b.v.due||'9999')});
  return L;
}
function opt(list,val,allLbl){return '<option value="">'+allLbl+'</option>'+list.map(function(x){return '<option'+(x===val?' selected':'')+'>'+esc(x)+'</option>'}).join('')}

  var r=R(),L;
  if(r.type==='buyer')L=all().filter(function(x){return x.t.buyer===r.name&&['Assigned','Acknowledged','InProgress','Reopened','Clarification'].indexOf(x.t.stage)>=0});

  var cta=function(x){var s=x.t.stage;return s==='Assigned'?'Acknowledge':s==='Acknowledged'?'Enter forecast':s==='Clarification'?'Reply to Quality':s==='PendingQV'?'Verify':s==='Reopened'?'Correct and resubmit':'Update or complete'};
  var cards=L.map(function(x){var t=x.t,v=x.v;var meta=v.ackOverdue?'Not acknowledged · '+v.age+' d':v.overdue?'Was due '+fmt(v.due)+' · '+v.late+' d late':v.due?'Due '+fmt(v.due):v.ackBy?'Acknowledge by '+fmt(v.ackBy):t.stage==='PendingQV'?'Verify by '+fmt(v.qvBy):'—';
    return '<a class="tcard" href="#/task/'+t.id+'"><div class="top2"><span class="mono">'+t.id+'</span>'+chip(v.status)+'</div><div><div class="ttl">'+esc(t.reason)+'</div><div class="meta">'+t.mat+' · Pos '+esc(t.pos)+' · '+esc((gate(t.ge)||{}).vendor||'')+'</div></div>'+
      '<div class="foot"><span style="color:'+(v.overdue||v.ackOverdue||v.qvOverdue?'var(--red-i)':'var(--ink2)')+'">'+meta+'</span><span style="color:var(--bl-i)">'+cta(x)+'</span></div></a>'}).join('');
  return '<div class="pagehead"><div><h1>My tasks</h1><div class="sub">'+esc(r.name)+' · '+L.length+' need your action'+(waiting?' · '+waiting+' with Quality':'')+'</div></div></div>'+
    (L.length?'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">'+cards+'</div>':'<div class="card empty">Nothing needs your action right now.</div>');
}

/* ---------- task detail ---------- */
function rTask(id){
  var t=task(id);if(!t)return '<div class="card pad">Task '+esc(id)+' was not found. <a href="#/dashboard">Back to dashboard</a></div>';
  var v=view(t),g=gate(t.ge)||{},s=S.settings;
  var reached={New:0,Exception:0,Assigned:1,Acknowledged:2,InProgress:3,Reopened:3,PendingQV:4,Clarification:4,Verified:6,Closed:6}[t.stage];
  var stepNames=['Created','Assigned','Acknowledged','In progress','Completed','Quality check','Closed'];
  var stepWhen=[t.createdOn,t.assignedOn,t.ackOn,t.forecast?t.ackOn:null,t.completionDate,t.sentToQuality,t.closedOn];
  var steps=stepNames.map(function(n,i){var cls=i<=reached?'done':(i===reached+1?'cur':'');return '<div class="step '+cls+'"><span class="b">'+(i+1)+'</span><span class="t">'+n+'<br><span class="w">'+(i<=reached&&stepWhen[i]?fmt(stepWhen[i]):(cls==='cur'?'Current':'Pending'))+'</span></span><span class="ln"></span></div>'}).join('');
  var facts=[['Gate entry',t.ge],['PO ref / date',(g.po||'')+' · '+fmt(g.poDate)],['Challan / invoice',(g.inv||'')+' · '+fmt(g.invDate)],['Vendor',g.vendor],
    ['GRN no / status',(g.grn||'—')+' · '+(g.grnStatus||'')],['Material',t.mat],['Description',S.mdesc[t.mat]||'—'],['Position no',t.pos],
    ['Stores location',g.loc],['Assigned Buyer',t.buyer||'Not assigned'],['Current owner',v.owner],['Rework cycle',t.cycle]].map(function(f){return '<div><div class="k">'+f[0]+'</div><div class="v">'+esc(f[1])+'</div></div>'}).join('');
  var calc=v.due?'<div class="calc"><div class="box"><span class="k">Proposed forecast</span><span class="v">'+fmt(t.forecast,true)+'</span></div><span class="op">+</span><div class="box"><span class="k">Fixed buffer</span><span class="v">'+s.buffer+' '+(s.basis==='working'?'working ':'')+'days</span></div><span class="op">+</span><div class="box"><span class="k">SLA days</span><span class="v">'+s.sla+' '+(s.basis==='working'?'working ':'')+'days</span></div><span class="op">=</span><div class="box '+(v.overdue?'late':'due')+'"><span class="k">Task due date</span><span class="v">'+fmt(v.due,true)+'</span></div></div>'+
    '<div class="sub">'+(v.overdue?'Overdue by '+v.late+' day(s). Escalation stays active until Quality verifies.':'Due Soon reminders start '+s.dueSoon+' day(s) before the due date.')+'</div>'
    :'<div class="note">The due date is calculated when the Buyer enters a forecast: forecast + '+s.buffer+' + '+s.sla+' '+(s.basis==='working'?'working ':'')+'days.'+(v.ackBy?' Acknowledgement is due by '+fmt(v.ackBy,true)+'.':'')+'</div>';
  var remarks='<div><b>Reason:</b> '+esc(t.reason)+(t.obs?' · <b>Observations:</b> '+esc(t.obs):'')+'</div>'+
    (t.completionRemarks?'<div><b>Completion remarks:</b> '+esc(t.completionRemarks)+'</div>':'')+
    (t.qResult&&t.qResult!=='Verified'?'<div class="note '+(t.qResult==='Rejected'?'bad':'amb')+'"><b>Quality: '+esc(t.qResult)+'.</b> '+esc(t.qRemarks)+'</div>':'');
  var H=t.history.map(function(h){var c=/Escalat|Overdue|Reject/.test(h.what)?'var(--red)':/revised/.test(h.what)?'#C58A00':/Verified|closed/i.test(h.what)?'var(--gr)':'var(--navy)';
    return '<div class="hi"><div class="rail"><i style="background:'+c+'"></i><span></span></div><div class="body"><span class="w">'+esc(h.what)+'</span>'+(h.detail?'<span class="d">'+esc(h.detail)+'</span>':'')+'<span class="m">'+esc(h.who)+' · '+fmtTs(h.at)+'</span></div></div>'}).join('');
  return '<a href="#/dashboard" style="font-weight:600;text-decoration:none">← Back to worklist</a>'+
    '<div class="pagehead"><div class="row"><h1 class="mono" style="font-weight:500">'+t.id+'</h1>'+chip(v.status)+(v.overdue&&v.status!=='Overdue'?'<span class="flag">Overdue</span>':'')+(v.escTxt!=='—'?'<span class="chip" style="background:var(--red-s);color:var(--red-i)">Escalation '+v.escTxt+'</span>':'')+(t.critical?'<span class="flag">Production-critical</span>':'')+'</div><div class="sub">Owner: '+esc(v.owner)+' · Ageing '+v.age+' d</div></div>'+
    '<div class="card steps">'+steps+'</div>'+
    '<div class="detail"><div class="col">'+
      '<section class="card pad action">'+rAction(t,v)+'</section>'+
      '<section class="card pad stack"><h2>Due date and SLA</h2>'+calc+'</section>'+
      '<section class="card pad stack"><h2>Gate entry and SAP details</h2><div class="facts">'+facts+'</div></section>'+
      '<section class="card pad stack"><h2>Rework details</h2>'+remarks+'</section>'+
    '</div><section class="card pad stack"><div class="row" style="justify-content:space-between"><h2>Audit history</h2><span class="sub" style="margin:0">'+t.history.length+' entries · read-only</span></div><div class="hist">'+H+'</div></section></div>';
}
function E(k){return ERR[k]?' class="err"':''}
function EM(k){return ERR[k]?'<span class="errmsg">'+esc(ERR[k])+'</span>':''}
function rAction(t,v){
  var r=R(),s=t.stage,me=r.name,out='';
  var isB=r.type==='buyer'&&t.buyer===me;
  var mine=function(h,body){return '<h2>'+h+'</h2>'+body};
  if(isB&&s==='Assigned'){
    out=mine('Acknowledge this task','<div class="stack"><p class="sub" style="margin:0">Acknowledge ownership, then enter your proposed forecast completion date.'+(v.ackBy?' Acknowledge by '+fmt(v.ackBy,true)+'.':'')+'</p>'+
      '<div class="row"><button class="btn" data-act="ack" data-id="'+t.id+'">Acknowledge</button></div>'+
      '<details class="more"><summary>Not my item? Raise an assignment exception</summary><form class="stack" data-form="raiseEx" data-id="'+t.id+'" style="margin-top:10px"><label class="field">Reason<textarea name="reason"'+E('reason')+' placeholder="e.g. material moved to another Buyer group"></textarea>'+EM('reason')+'</label><div class="row"><button class="btn warn" type="submit">Raise assignment exception</button></div></form></details></div>');
  } else if(isB&&s==='Acknowledged'){
    out=mine('Enter forecast completion date','<form class="stack" data-form="forecast" data-id="'+t.id+'"><div class="formgrid"><label class="field">Proposed forecast completion date<input type="date" name="date" min="'+S.today+'" data-preview="due"'+E('date')+'>'+EM('date')+'</label>'+
      '<div class="field">Calculated task due date<div class="note" id="duePrev" style="font-size:16px;font-weight:600">Pick a date to see the due date</div></div></div>'+
      '<label class="field">Remarks <span class="hint">Optional</span><textarea name="remark" placeholder="Plan, supplier contact, blockers"></textarea></label><div class="row"><button class="btn" type="submit">Save forecast and start work</button></div></form>');
  } else if(isB&&(s==='InProgress'||s==='Reopened')){
    var head=s==='Reopened'?'Correct and resubmit to Quality':'Complete rework';
    out=mine(head,(s==='Reopened'?'<div class="note bad" style="margin-bottom:12px"><b>Rejected by Quality:</b> '+esc(t.qRemarks)+'</div>':'')+
      '<form class="stack" data-form="complete" data-id="'+t.id+'"><div class="formgrid"><label class="field">Completion date<input type="date" name="date" value="'+S.today+'" max="'+S.today+'"></label>'+
      '<label class="field">Reassign to<select name="to"><option>Quality Department – verification queue</option></select></label></div>'+
      '<label class="field">Completion remarks <span class="req">Required to complete</span><textarea name="remarks" data-need="completeBtn"'+E('remarks')+' placeholder="What was reworked, quantity, who did it, evidence"></textarea>'+EM('remarks')+'</label>'+
      '<div class="row"><button class="btn good" id="completeBtn" type="submit" disabled>Mark complete and send to Quality</button><span class="sub" style="margin:0">The task stays open until Quality records a result.</span></div></form>'+
      '<details class="more"><summary>Revise forecast date</summary><form class="stack" data-form="revise" data-id="'+t.id+'" style="margin-top:10px"><div class="formgrid"><label class="field">New forecast date<input type="date" name="date" min="'+S.today+'" data-preview="due"'+E('rdate')+'>'+EM('rdate')+'</label><div class="field">New due date<div class="note" id="duePrev" style="font-weight:600">Current due date '+fmt(v.due,true)+'</div></div></div>'+
      '<label class="field">Revision reason <span class="req">Required</span><textarea name="reason"'+E('rreason')+'></textarea>'+EM('rreason')+'</label><div class="row"><button class="btn sec" type="submit">Save revised forecast</button></div></form></details>'+
      '<details class="more"><summary>Add progress remark</summary><form class="stack" data-form="remark" data-id="'+t.id+'" style="margin-top:10px"><textarea name="text" aria-label="Progress remark"'+E('text')+'></textarea>'+EM('text')+'<div class="row"><button class="btn sec" type="submit">Add remark</button></div></form></details>');
  } else if(isB&&s==='Clarification'){
    out=mine('Reply to Quality','<div class="note amb" style="margin-bottom:12px"><b>Quality asks:</b> '+esc(t.qRemarks)+'</div><form class="stack" data-form="clarify" data-id="'+t.id+'"><label class="field">Clarification <span class="req">Required</span><textarea name="text"'+E('text')+'></textarea>'+EM('text')+'</label><div class="row"><button class="btn" type="submit">Send clarification to Quality</button></div></form>');
  } else if(r.type==='quality'&&s==='PendingQV'){
    out=mine('Record verification result','<form class="stack" data-form="verify" data-id="'+t.id+'"><div class="note"><b>Buyer completion remarks:</b> '+esc(t.completionRemarks||'—')+'</div>'+
      '<fieldset style="border:none;margin:0;padding:0" class="stack"><legend class="field" style="padding:0 0 8px">Verification result</legend>'+
      '<label class="radio"><input type="radio" name="result" value="Verified" checked>Verified – close the task</label>'+
      '<label class="radio"><input type="radio" name="result" value="Clarification Required">Clarification required from Buyer</label>'+
      '<label class="radio"><input type="radio" name="result" value="Rejected">Rejected – reopen to Buyer</label></fieldset>'+
      '<label class="field">Verification remarks <span class="hint">Required for Rejected or Clarification</span><textarea name="remarks"'+E('qremarks')+' placeholder="Observations, samples checked, reason for rejection"></textarea>'+EM('qremarks')+'</label>'+
      '<div class="row"><button class="btn good" type="submit">Record result</button></div></form>');
  } else if(r.type==='admin'&&s==='Exception'){
    var cands=S.sap[t.mat]||[];
    out=mine('Resolve assignment exception','<form class="stack" data-form="resolve" data-id="'+t.id+'"><div class="note amb">SAP returned '+(cands.length?cands.length+' Buyers ('+esc(cands.join(', '))+')':'no Buyer')+' for '+t.mat+'.</div>'+
      '<div class="formgrid"><label class="field">Authorised Buyer<select name="buyer"'+E('buyer')+'><option value="">Choose Buyer…</option>'+BUYERS.map(function(b){return '<option>'+b+(cands.indexOf(b)>=0?'':'')+'</option>'}).join('')+'</select>'+EM('buyer')+'</label>'+
      '<label class="field">Reason <span class="req">Required</span><input type="text" name="reason"'+E('reason')+' placeholder="e.g. SAP mapping pending">'+EM('reason')+'</label></div><div class="row"><button class="btn" type="submit">Assign Buyer and send intimation</button></div></form>');
  } else if(r.type==='admin'&&s==='Closed'){
    out=mine('Closed','<div class="stack"><div class="note ok">Verified by Quality and closed on '+fmt(t.closedOn,true)+'.</div><details class="more"><summary>Reopen through authorised exception</summary><form class="stack" data-form="reopenClosed" data-id="'+t.id+'" style="margin-top:10px"><label class="field">Reason <span class="req">Required</span><textarea name="reason"'+E('reason')+'></textarea>'+EM('reason')+'</label><div class="row"><button class="btn warn" type="submit">Reopen task</button></div></form></details></div>');
  } else {
    var msg=s==='Closed'?'<div class="note ok">Verified by Quality and closed on '+fmt(t.closedOn,true)+'. No further action.</div>':
      '<div class="note">Waiting on <b>'+esc(v.owner)+'</b>. '+(r.type==='view'||r.type==='stores'?'Your role has read access.':'Switch role in the prototype controls to act as '+esc(v.owner)+'.')+'</div>';
    out=mine('Next action',msg);
  }
  if((r.type==='mgr'||r.type==='admin')&&['Closed','Verified','Exception','New'].indexOf(s)<0){
    out+=t.critical?'<div class="note bad" style="margin-top:12px"><b>Production-critical:</b> '+esc(t.criticalReason)+'</div>':
      '<details class="more" style="margin-top:12px"><summary>Mark production-critical</summary><form class="stack" data-form="critical" data-id="'+t.id+'" style="margin-top:10px"><label class="field">Reason <span class="req">Required</span><input type="text" name="reason"'+E('creason')+' placeholder="e.g. line stoppage risk on Assembly line 2">'+EM('creason')+'</label><div class="row"><button class="btn warn" type="submit">Mark critical and escalate to Level 3</button></div></form></details>';
  }
  return out;
}

/* ---------- new task (Inward QA) ---------- */
function rNew(geArg){
  if(R().type!=='qa')return '<div class="card pad stack"><h2>Initiate rework</h2><div class="note">Only Inward QA can create rework tasks. Switch role to <b>Inward QA</b> in the prototype controls.</div></div>';
  var list=S.gate.filter(function(g){return g.grnStatus!=='Cleared'||g.rwk});
  var cur=gate(NEWF.ge||geArg)||list[0];NEWF.ge=cur.no;
  var lines=cur.lines,line=lines.filter(function(l){return l.mat===NEWF.mat})[0]||null;
  var buyers=NEWF.mat?(S.sap[NEWF.mat]||[]):null;
  var look=!NEWF.mat?'<div class="note">Select a Material Code to look up the assigned Buyer in SAP.</div>':
    buyers.length===1?'<div class="note ok"><b>Assigned Buyer from SAP: '+esc(buyers[0])+'.</b> An intimation is sent when you submit.</div>':
    '<div class="note amb"><b>SAP returned '+(buyers.length?buyers.length+' Buyers':'no Buyer')+'.</b> The task will be created as an Assignment Exception for the Purchasing Coordinator.</div>';
  return '<div class="pagehead"><div><h1>Initiate rework</h1><div class="sub">Inward QA · creates a rework task and informs the SAP-assigned Buyer</div></div></div>'+
    '<form class="card pad stack" data-form="create" style="max-width:820px">'+
    '<label class="field">Gate entry <span class="hint">Entries with GRN not cleared or material parked in RWK</span><select name="ge" data-new="ge">'+list.map(function(g){return '<option value="'+g.no+'"'+(g.no===cur.no?' selected':'')+'>'+g.no+' · PO '+g.po+' · '+esc(g.vendor)+'</option>'}).join('')+'</select></label>'+
    '<div class="facts" style="background:var(--surface2);border-radius:10px;padding:14px"><div><div class="k">PO / date</div><div class="v">'+cur.po+' · '+fmt(cur.poDate)+'</div></div><div><div class="k">Invoice</div><div class="v">'+cur.inv+' · '+fmt(cur.invDate)+'</div></div><div><div class="k">Vendor</div><div class="v">'+esc(cur.vendor)+'</div></div><div><div class="k">GRN</div><div class="v">'+(cur.grn||'—')+' · '+cur.grnStatus+'</div></div></div>'+
    '<div class="formgrid"><label class="field">Material Code <span class="req">Required</span><select name="mat" data-new="mat"'+E('mat')+'><option value="">Select material…</option>'+lines.map(function(l){return '<option value="'+l.mat+'"'+(l.mat===NEWF.mat?' selected':'')+'>'+l.mat+' · '+esc(S.mdesc[l.mat]||'')+'</option>'}).join('')+'</select>'+EM('mat')+'</label>'+
    '<label class="field">Position Number <span class="req">Required</span><input type="text" name="pos" inputmode="numeric" value="'+esc(NEWF.pos||(line?line.pos:''))+'"'+E('pos')+'>'+EM('pos')+'</label>'+
    '<label class="field">Rework Reason <span class="req">Required</span><select name="reason"'+E('reason')+'><option value="">Select reason…</option>'+S.reasons.map(function(x){return '<option'+(x===NEWF.reason?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>'+EM('reason')+'</label>'+
    '<label class="field">Observations <span class="hint">Optional</span><input type="text" name="obs" value="'+esc(NEWF.obs||'')+'" placeholder="What was found, quantity affected"></label></div>'+
    look+'<div class="row"><button class="btn" type="submit">Submit rework task</button><a class="btn sec" href="#/dashboard">Cancel</a></div></form>';
}
var NEWF={};

/* ---------- gate entries ---------- */
function rGate(){
  var r=R(),show=F.gateAll;

    '<div class="sub">'+(r.type==='buyer'||r.type==='mgr'?'Set GRN clearance priority here. ':'')+(r.type==='stores'?'Stores can confirm RWK parking and location. ':'')+(r.type==='qa'?'Pick an entry to start a rework task. ':'')+'</div>';

  var sap=Object.keys(S.sap).sort().map(function(m){var b=S.sap[m];return '<tr><td class="mono">'+m+'</td><td>'+esc(S.mdesc[m]||'')+'</td><td>'+(b.length?esc(b.join(', ')):'<span style="color:var(--red-i)">None</span>')+'</td></tr>'}).join('');
  return '<div class="pagehead"><div><h1>'+(r.type==='admin'?'Administration':'Settings')+'</h1><div class="sub">'+(r.type==='admin'?'SLA rules, masters and assignment exceptions':'Read-only. Switch to Administrator to change settings.')+'</div></div></div>'+
    '<form class="card pad stack" data-form="settings"><div class="row" style="justify-content:space-between"><h2>SLA and escalation rules</h2>'+(r.type==='admin'?'<button class="btn" type="submit">Save changes</button>':'')+'</div>'+
      '<div class="grid4"><label class="field">Day counting basis<select name="basis" data-preview="cfg"'+ro+'><option value="working"'+(s.basis==='working'?' selected':'')+'>Working days</option><option value="calendar"'+(s.basis==='calendar'?' selected':'')+'>Calendar days</option></select></label>'+
      num('buffer','Fixed buffer','days')+num('sla','SLA days')+num('ackSla','Ack SLA','days')+num('dueSoon','Due Soon window','days')+num('qSla','Quality SLA','days')+'<div></div><div></div></div>'+
      '<div class="note" id="cfgPrev"></div>'+
      '<div class="field">Overdue escalation thresholds <span class="hint">days after the task due date</span></div>'+
      '<div class="grid3"><div class="lvl"><b>Level 1</b>'+num('l1','After')+'<span class="sub" style="margin:0">Buyer → Buyer Manager / Purchase Head</span></div><div class="lvl"><b>Level 2</b>'+num('l2','After')+'<span class="sub" style="margin:0">Buyer Manager → Function Head; Planner / Assembly informed</span></div><div class="lvl"><b>Level 3 / critical</b>'+num('l3','After')+'<span class="sub" style="margin:0">Function Head → Plant / Operations leadership</span></div></div>'+
    '</form>'+
    '<section class="card"><div class="pad row" style="justify-content:space-between;border-bottom:1px solid var(--line2)"><h2>Assignment exceptions</h2><span class="sub" style="margin:0">SAP did not return exactly one Buyer</span></div>'+(exRows?'<div class="tablewrap"><table><thead><tr><th>Task</th><th>Material</th><th>SAP result</th><th>Open for</th><th></th></tr></thead><tbody>'+exRows+'</tbody></table></div>':'<div class="empty">No open exceptions.</div>')+'</section>'+
    '<div class="grid2"><section class="card pad stack"><h2>Rework Reason master</h2><div>'+S.reasons.map(function(x,i){return '<span class="pill">'+esc(x)+(r.type==='admin'?'<button data-act="delReason" data-i="'+i+'" aria-label="Remove '+esc(x)+'">×</button>':'')+'</span>'}).join('')+'</div>'+
      (r.type==='admin'?'<form class="row" data-form="addReason"><input type="text" name="v" aria-label="New rework reason" placeholder="New reason" style="flex:1 1 200px;width:auto"><button class="btn sec" type="submit">Add reason</button></form>':'')+'</section>'+
    '<section class="card pad stack"><h2>Working calendar holidays</h2><div class="sub" style="margin:0">Weekends are non-working. Holidays are excluded from all day counts.</div><div>'+(S.holidays.length?S.holidays.slice().sort().map(function(x,i){return '<span class="pill">'+fmt(x,true)+(r.type==='admin'?'<button data-act="delHol" data-v="'+x+'" aria-label="Remove '+fmt(x,true)+'">×</button>':'')+'</span>'}).join(''):'<span class="dim">No holidays configured.</span>')+'</div>'+
      (r.type==='admin'?'<form class="row" data-form="addHol"><input type="date" name="v" aria-label="Holiday date" style="flex:1 1 180px;width:auto"><button class="btn sec" type="submit">Add holiday</button></form>':'')+'</section></div>'+
    '<section class="card"><div class="pad row" style="justify-content:space-between;border-bottom:1px solid var(--line2)"><h2>SAP Buyer assignment (read from SAP)</h2><span class="sub" style="margin:0">Material Master and Buyer mapping, simulated</span></div><div class="tablewrap"><table><thead><tr><th>Material</th><th>Description</th><th>Assigned Buyer(s)</th></tr></thead><tbody>'+sap+'</tbody></table></div></section>'+
    (S.settingsLog.length?'<section class="card pad stack"><h2>Settings change log</h2>'+S.settingsLog.map(function(l){return '<div class="sub" style="margin:0">'+fmtTs(l.at)+' · '+esc(l.who)+' · '+esc(l.what)+'</div>'}).join('')+'</section>':'');
}

/* ---------- live bits (previews, enabling) ---------- */
function bindLive(){
  var cp=document.getElementById('cfgPrev');if(cp)cfgPreview();
  var need=document.querySelector('[data-need]');if(need){var b=document.getElementById(need.getAttribute('data-need'));if(b)b.disabled=!need.value.trim()}
}
function cfgPreview(){
  var f=document.querySelector('form[data-form="settings"]');if(!f)return;
  var d=Object.fromEntries(new FormData(f));var keep=S.settings;var tmp={};for(var k in keep)tmp[k]=keep[k];
  ['buffer','sla','ackSla','dueSoon','qSla','l1','l2','l3'].forEach(function(k){if(d[k]!==undefined)tmp[k]=parseInt(d[k],10)||0});if(d.basis)tmp.basis=d.basis;
  S.settings=tmp;var fc=addDays(S.today,3),due=addDays(fc,tmp.buffer+tmp.sla);S.settings=keep;
  document.getElementById('cfgPrev').innerHTML='Preview: forecast '+fmt(fc,true)+' + '+tmp.buffer+' + '+tmp.sla+' '+(tmp.basis==='working'?'working ':'')+'days → task due date <b>'+fmt(due,true)+'</b>.';
}
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.matches('[data-need]')){var b=document.getElementById(el.getAttribute('data-need'));if(b)b.disabled=!el.value.trim()}
  if(el.matches('[data-preview="due"]')){var p=document.getElementById('duePrev');if(p)p.innerHTML=el.value?'<b>'+fmt(addDays(el.value,S.settings.buffer+S.settings.sla),true)+'</b> <span style="font-weight:400">('+S.settings.buffer+' + '+S.settings.sla+(S.settings.basis==='working'?' working':'')+' days)</span>':'Pick a date to see the due date'}
  if(el.matches('[data-preview="cfg"]'))cfgPreview();
  if(el.matches('[data-f]')&&el.type==='text'){F[el.getAttribute('data-f')]=el.value;var pos=el.selectionStart;render();var n=document.querySelector('[data-f="pos"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',function(e){
  var el=e.target,k;
  if(el.matches('[data-f]')&&el.type!=='text'){k=el.getAttribute('data-f');F[k]=el.type==='checkbox'?el.checked:el.value;render();return}
  if(el.matches('[data-new]')){k=el.getAttribute('data-new');var fe=el.form.elements;NEWF.reason=fe.namedItem('reason').value;NEWF.obs=fe.namedItem('obs').value;NEWF.pos=k==='mat'?'':fe.namedItem('pos').value;NEWF[k]=el.value;if(k==='ge'){NEWF.mat='';NEWF.pos=''}ERR={};render();return}
  var a=el.getAttribute('data-act-change');
  if(a==='prio'){var g=gate(el.getAttribute('data-ge'));g.priority=el.value;save();toast('GRN priority for '+g.no+' set to '+el.value+'.');render()}
  if(a==='rwk'){var g2=gate(el.getAttribute('data-ge'));g2.rwk=el.checked;save();toast(g2.no+(el.checked?' marked as parked in RWK.':' no longer parked in RWK.'));render()}
  if(a==='gateAll'){F.gateAll=el.checked;render()}
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act'),t=task(b.getAttribute('data-id'));
  if(a==='tile'){var i=+b.getAttribute('data-i');F.tile=F.tile===i?-1:i;render()}
  else if(a==='clearf'){F={tile:-1,mat:'',pos:'',reason:'',buyer:'',status:'',due:'',overdue:false,closed:false,gateAll:F.gateAll};render()}
  else if(a==='export'){toast('Export prepared: '+filtered().length+' rows with the current filters (Excel download in the live system).')}
  else if(a==='ack'){t.stage='Acknowledged';t.ackOn=S.today;hist(t,R().name,'Acknowledged',(view(t).ackOverdue?'After Ack SLA':'Within Ack SLA'));save();toast('Acknowledged. Now enter your forecast date.');render()}
  else if(a==='saveloc'){var g=gate(b.getAttribute('data-ge'));var inp=document.querySelector('[data-loc="'+g.no+'"]');g.loc=inp.value.trim()||g.loc;save();toast('Location for '+g.no+' saved.');render()}
  else if(a==='newfor'){NEWF={ge:b.getAttribute('data-ge')};ERR={}}
  else if(a==='delReason'){S.reasons.splice(+b.getAttribute('data-i'),1);save();render()}
  else if(a==='delHol'){S.holidays=S.holidays.filter(function(x){return x!==b.getAttribute('data-v')});save();runMonitor();save();render()}
});

/* ---------- form handlers ---------- */
var H={
  raiseEx:function(d,t){if(!d.reason.trim())return {reason:'Enter why this is not your item.'};var me=R().name;t.stage='Exception';hist(t,me,'Assignment exception raised by Buyer',d.reason);t.buyer=null;t.assignedOn=null;notify('Assignment exception',t,['Purchasing Coordinator','Procurement Manager'],'In-app alert + email/Teams');return 'Assignment exception raised. The Purchasing Coordinator has been alerted.'},
  forecast:function(d,t){if(!d.date)return {date:'Choose a forecast date.'};t.forecast=d.date;t.stage='InProgress';t.escN={lvl:0,ack:true,qv:false,soon:false};hist(t,R().name,'Forecast date entered',fmt(d.date)+' · due date '+fmt(dueOf(t)));if(d.remark.trim())hist(t,R().name,'Remark added',d.remark.trim());return 'Forecast saved. Task due date is '+fmt(dueOf(t),true)+'.'},
  revise:function(d,t){var e={};if(!d.date)e.rdate='Choose the new forecast date.';if(!d.reason.trim())e.rreason='A revision reason is required.';if(Object.keys(e).length)return e;var od=dueOf(t),of=t.forecast;t.forecast=d.date;if(t.stage==='Reopened')t.stage='InProgress';t.escN.lvl=0;t.escN.soon=false;hist(t,R().name,'Forecast date revised',fmt(of)+' → '+fmt(d.date)+' · due '+fmt(od)+' → '+fmt(dueOf(t))+' · Reason: '+d.reason.trim());notify('Forecast date revised',t,[t.buyer,'Buyer Manager','Planner','Inward QA'],'Change notification');return 'Forecast revised. New due date '+fmt(dueOf(t),true)+'.'},
  remark:function(d,t){if(!d.text.trim())return {text:'Write a remark first.'};hist(t,R().name,'Remark added',d.text.trim());return 'Remark added.'},
  complete:function(d,t){if(!d.remarks.trim())return {remarks:'Completion remarks are required.'};var me=R().name;t.completionDate=d.date||S.today;t.completionRemarks=d.remarks.trim();hist(t,me,'Completed',t.completionRemarks);t.stage='PendingQV';t.sentToQuality=S.today;t.escN.qv=false;hist(t,me,'Reassigned to Quality','Pending Quality Verification');notify('Pending Quality Verification',t,['Quality inspector'],'In-app + email/Teams');return 'Sent to Quality for verification.'},
  clarify:function(d,t){if(!d.text.trim())return {text:'Enter the clarification.'};hist(t,R().name,'Clarification provided',d.text.trim());t.completionRemarks+=(t.completionRemarks?' | ':'')+'Clarification: '+d.text.trim();t.stage='PendingQV';t.sentToQuality=S.today;t.escN.qv=false;notify('Clarification provided',t,['Quality inspector'],'In-app + email/Teams');return 'Clarification sent to Quality.'},
  verify:function(d,t){var res=d.result,rm=(d.remarks||'').trim();if(res!=='Verified'&&!rm)return {qremarks:'Remarks are required for '+res+'.'};var me=R().name;t.qResult=res;t.qRemarks=rm;
    if(res==='Verified'){hist(t,me,'Verified',rm||'Rework satisfactory');t.stage='Closed';t.closedOn=S.today;hist(t,'System','Task closed','Closure notification sent to Inward QA, Buyer and relevant functions');notify('Task verified and closed',t,['Inward QA inspector',t.buyer,'Planner','Stores'],'Closure notification');return 'Verified. The task is closed.'}
    if(res==='Rejected'){hist(t,me,'Rejected – task reopened',rm);t.stage='Reopened';t.cycle++;t.escN.soon=false;notify('Rejected / reopened',t,[t.buyer,'Buyer Manager','Inward QA inspector'],'Notification with rejection remarks');return 'Rejected. Returned to '+t.buyer+' as Reopened.'}
    hist(t,me,'Clarification requested',rm);t.stage='Clarification';notify('Clarification required',t,[t.buyer],'In-app + email/Teams');return 'Clarification requested from '+t.buyer+'.'},
  resolve:function(d,t){var e={};if(!d.buyer)e.buyer='Choose an authorised Buyer.';if(!d.reason.trim())e.reason='Enter the reason for this assignment.';if(Object.keys(e).length)return e;t.buyer=d.buyer;t.stage='Assigned';t.assignedOn=S.today;t.escN={lvl:0,ack:false,qv:false,soon:false};hist(t,R().name,'Assignment exception resolved','Buyer '+d.buyer+' · Reason: '+d.reason.trim());hist(t,'System','Assigned and intimation sent','Buyer '+d.buyer);notify('Task assigned',t,[d.buyer],'In-app + email/Teams');return 'Assigned to '+d.buyer+'. Intimation sent.'},
  critical:function(d,t){if(!d.reason.trim())return {creason:'Enter why this is production-critical.'};t.critical=true;t.criticalReason=d.reason.trim();hist(t,R().name,'Marked production-critical',t.criticalReason);return 'Marked production-critical.'},
  reopenClosed:function(d,t){if(!d.reason.trim())return {reason:'A reason is required.'};t.stage='Reopened';t.cycle++;t.closedOn=null;t.qResult='Rejected';t.qRemarks='Reopened by exception: '+d.reason.trim();t.escN={lvl:0,ack:true,qv:false,soon:false};hist(t,R().name,'Reopened through authorised exception',d.reason.trim());notify('Rejected / reopened',t,[t.buyer,'Buyer Manager'],'Notification');return 'Task reopened to '+t.buyer+'.'},
  create:function(d){var e={};if(!d.mat)e.mat='Select a Material Code.';if(!String(d.pos).trim())e.pos='Enter the Position Number.';if(!d.reason)e.reason='Select a Rework Reason.';if(Object.keys(e).length){NEWF={ge:d.ge,mat:d.mat,pos:d.pos,reason:d.reason,obs:d.obs};return e}
    S.seq++;var id='RW-'+S.today.slice(0,4)+'-0'+S.seq,c=S.sap[d.mat]||[];
    var t={id:id,ge:d.ge,mat:d.mat,pos:String(d.pos).trim(),reason:d.reason,obs:(d.obs||'').trim(),buyer:null,stage:'New',createdOn:S.today,assignedOn:null,ackOn:null,forecast:null,sentToQuality:null,completionDate:null,completionRemarks:'',qResult:'',qRemarks:'',closedOn:null,cycle:1,critical:false,criticalReason:'',history:[],escN:{lvl:0,ack:false,qv:false,soon:false}};
    hist(t,R().name,'Rework task created','Pos '+t.pos+' · '+t.reason+(t.obs?' · '+t.obs:''));
    var g=gate(d.ge);if(g&&!g.rwk){g.rwk=true}
    if(c.length===1){t.buyer=c[0];t.stage='Assigned';t.assignedOn=S.today;hist(t,'System','Assigned and intimation sent','Buyer '+c[0]+' from SAP for '+t.mat);notify('Task created / assigned',t,[c[0]],'In-app + email/Teams')}
    else{t.stage='Exception';hist(t,'System','Assignment exception','SAP returned '+(c.length?c.length+' Buyers':'no Buyer')+' for '+t.mat);notify('Assignment exception',t,['Purchasing Coordinator','Procurement Manager'],'In-app alert + email/Teams')}
    S.tasks.unshift(t);NEWF={};location.hash='#/task/'+id;return c.length===1?'Task '+id+' created and sent to '+c[0]+'.':'Task '+id+' created as an Assignment Exception.'},
  settings:function(d){if(R().type!=='admin')return {};var o=S.settings,n={basis:d.basis};var ch=[];['buffer','sla','ackSla','dueSoon','qSla','l1','l2','l3'].forEach(function(k){n[k]=Math.max(0,parseInt(d[k],10)||0)});
    if(!(n.l1<=n.l2&&n.l2<=n.l3))return {};for(var k in n)if(n[k]!==o[k])ch.push(k+': '+o[k]+' → '+n[k]);if(!ch.length)return 'No changes to save.';S.settings=n;S.settingsLog.unshift({at:now(),who:R().name,what:ch.join(', ')});S.tasks.forEach(function(t){if(t.escN){t.escN.lvl=Math.min(t.escN.lvl,view(t).esc)}});return 'Settings saved. All due dates recalculated.'},
  addReason:function(d){var v=(d.v||'').trim();if(!v||S.reasons.indexOf(v)>=0)return 'Enter a new, unique reason.';S.reasons.push(v);return 'Reason added.'},
  addHol:function(d){if(!d.v)return 'Pick a date.';if(S.holidays.indexOf(d.v)<0)S.holidays.push(d.v);return 'Holiday added. Due dates recalculated.'}
};
document.addEventListener('submit',function(e){
  var f=e.target,k=f.getAttribute('data-form');if(!k||!H[k])return;e.preventDefault();
  var d=Object.fromEntries(new FormData(f)),t=task(f.getAttribute('data-id'));
  var res=H[k](d,t);
  if(res&&typeof res==='object'){ERR=res;render();if(k==='settings'&&R().type==='admin')toast('Escalation levels must increase: Level 1 ≤ Level 2 ≤ Level 3.');return}
  ERR={};runMonitor();save();if(res)toast(res);render();window.scrollTo({top:0});
});

/* ---------- demo controls ---------- */
var sel=document.getElementById('roleSel');
sel.innerHTML=ROLES.map(function(r){return '<option value="'+r.id+'">'+r.label+'</option>'}).join('');
sel.addEventListener('change',function(){S.role=sel.value;ERR={};NEWF={};save();var rt=route();if(rt.page==='my'||rt.page==='new'){var t=R().type;if(!(t==='buyer'||t==='quality')&&rt.page==='my')location.hash='#/dashboard';if(t!=='qa'&&rt.page==='new')location.hash='#/dashboard'}render();toast('Now viewing as '+R().label+'.')});
document.getElementById('nextDay').addEventListener('click',function(){S.today=addCal(S.today,1);var n=runMonitor();save();render();toast('Moved to '+fmt(S.today,true)+'. Monitoring ran: '+n+' new alert'+(n===1?'':'s')+'.')});
document.getElementById('devDesk').addEventListener('click',function(){S.phone=false;save();render()});
document.getElementById('devPhone').addEventListener('click',function(){S.phone=true;save();render()});
document.getElementById('resetBtn').addEventListener('click',function(){if(confirm('Reset all demo data to the starting sample?')){try{localStorage.removeItem(STORE)}catch(e){}F={tile:-1,mat:'',pos:'',reason:'',buyer:'',status:'',due:'',overdue:false,closed:false};NEWF={};ERR={};seed();save();location.hash='#/dashboard';render();toast('Demo data reset.')}});
window.addEventListener('hashchange',function(){ERR={};var rt=route();if(rt.page==='new'&&rt.arg&&NEWF.ge!==rt.arg)NEWF={ge:rt.arg};render();window.scrollTo({top:0})});

load();render();
})();
